# .github/workflows/ci.yml
# CI Pipeline — Lint & Build check setiap push/PR
name: CI — Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma client (hanya butuh schema, tidak konek DB)
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Lint
      - name: Run ESLint
        run: npm run lint

      # 6. Build (memastikan tidak ada error build)
      - name: Build Next.js
        run: npm run build
        env:
          # Dummy URL — CI tidak konek ke SQL Server on-premise
          DATABASE_URL: "sqlserver://localhost:1433;database=dummy;user=sa;password=DummyPass123;trustServerCertificate=true"
          AUTH_SECRET: "ci-dummy-secret-for-build-only-minimum-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
