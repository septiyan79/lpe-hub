# .github/workflows/ci.yml
# CI Pipeline — Build check setiap push/PR
name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Environment variables untuk seluruh job
# Prisma v6 prisma.config.ts membutuhkan DATABASE_URL saat generate
# Gunakan dummy URL karena CI tidak perlu konek ke database
env:
  DATABASE_URL: "sqlserver://localhost:1433;database=dummy;user=sa;password=DummyPass123;trustServerCertificate=true"
  AUTH_SECRET: "ci-dummy-secret-for-build-only-minimum-32-chars"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 (Node 20 sudah deprecated di GitHub Actions)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma client (butuh DATABASE_URL dari env di atas)
      - name: Generate Prisma Client
        run: npx prisma generate

      # 5. Run unit tests
      - name: Run Unit Tests
        run: npm test

      # 6. Build (memastikan tidak ada error build)
      - name: Build Next.js
        run: npm run build

      # 7. Install browser Chromium untuk Playwright (hanya chromium agar cepat & hemat kuota)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 8. Jalankan seluruh pengujian E2E (21 skenario)
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          
      # 9. Upload laporan HTML jika ada pengujian yang gagal (tersimpan 7 hari)
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
